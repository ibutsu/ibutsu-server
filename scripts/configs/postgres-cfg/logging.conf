# PostgreSQL logging configuration
# Send logs to stderr so they appear in kubectl/podman logs instead of log files
logging_collector = off
log_destination = 'stderr'

# Connection and session logging (enabled for local dev debugging)
log_connections = on
log_disconnections = on
log_duration = off

# Severity levels and statement error reporting
log_min_messages = warning
client_min_messages = notice
log_min_error_statement = error

# Statement logging: log DDL statements and slow queries
log_statement = ddl
log_min_duration_statement = 500

# Diagnostics for locks, checkpoints, and temporary files
log_lock_waits = on
log_checkpoints = on
log_temp_files = 10240

# Structured line prefix
log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '
