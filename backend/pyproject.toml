[project]
version = "3.1.2"
name = "ibutsu_server"
description = "A system to store and query test results and artifacts"
authors = [
    {name = "Raoul Snyman"},
    {name = "John Dupuy", email = "jdupuy26@gmail.com"},
]
maintainers = [
    {name = "Mike Shriver", email = "mshriver@redhat.com"},
    {name = "Egor Shamardin", email = "eshamard@redhat.com"},
]
keywords = ["OpenAPI", "Ibutsu"]
requires-python = ">=3.14"

classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: Pytest",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Testing",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
]

dependencies = [
    "alembic",
    "bcrypt>=5.0.0",
    "celery",
    "Flask",
    "flask_mail",
    "Flask-SQLAlchemy",
    "kombu",
    "psycopg2-binary",
    "pyjwt",
    "python_dateutil",
    "PyYAML",
    "redis<8",
    "sqlalchemy",
    "sqlalchemy-json",
    "vine",
    "werkzeug",
]

[dependency-groups]
dev = [
    "pre-commit",
]
test = [
    "coverage[toml]",
    "Flask-Testing",
    "pytest",
    "pytest-cov",
    "pytest-mock",
    "pytest-xdist",
    "randomize",
]
server = [
    "connexion[swagger-ui]",
    "connexion[flask]",
    "google-api-python-client",
    "google-auth",
    "google-auth-httplib2",
    "google-auth-oauthlib",
    "gunicorn",
    "httpx2>=2.0.0",
    "kombu",
    "lxml",
    "psycopg2-binary",
    "pyjwt",
    "python-magic",
    "starlette",
    "swagger-ui-bundle",
    "uvicorn[standard]",
]
worker = [
    "gevent>=24.0.0",
    "lxml",
]
flower = [
    "flower>=2.0.0",
    "celery",
    "redis<8",
]

[tool.uv]
default-groups = ["server", "worker", "test", "dev"]

[project.urls]
Source = "https://github.com/ibutsu/ibutsu-server"

[project.scripts]
ibutsu_server = "ibutsu_server.__main__:main"

[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

# move to src layout
# don't package tests, so they can be run without editable install
[tool.hatch.build.targets.wheel]
packages = ["ibutsu_server"]
exclude = [
    "docker/",
    "tests/",
    "**/test/",
    "**/tests/",
    "test_*.py",
    "*_test.py",
    "conftest.py",
]

[tool.hatch.build.targets.sdist]
exclude = [
    "tests/",
    "**/test/",
    "**/tests/",
    "test_*.py",
    "*_test.py",
    "conftest.py",
    "coverage.xml",
    "htmlcov/",
    ".pytest_cache/",
    ".coverage",
    ".coverage.*",
]


[tool.ruff]
line-length = 100
unsafe-fixes = true
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "N",    # pep8-naming
    "S",    # flake8-bandit (security)
    "T20",  # flake8-print
    "PT",   # flake8-pytest-style
    "RET",  # flake8-return
    "SIM",  # flake8-simplify
    "ARG",  # flake8-unused-arguments
    "PTH",  # flake8-use-pathlib
    "ERA",  # eradicate (commented-out code)
    "PL",   # Pylint
    "RUF",  # Ruff-specific rules
]

# Ignore specific rules that might be too strict for existing codebase
# TODO: Remove these once violations are fixed
ignore = [
    "PLR0915", # Too many statements (hard to refactor in __init__.py and tasks/importers.py)
    "N806",   # Variable in function should be lowercase (API compatibility and __main__.py)
    "T201",   # print found (used in __main__.py, controllers, tasks - should migrate to logging)
]

# Per-file ignores
[tool.ruff.lint.per-file-ignores]
"**/controllers/**/*.py" = [
    "ARG001",  # Unused function argument (Connexion passes token_info/user automatically)
    "ARG002",  # Unused method argument
    "PLR2004", # Magic value used in comparison (HTTP status codes, page limits)
]
"**/widgets/**/*.py" = [
    "ARG001",  # Unused function argument (Widget functions must accept all WIDGET_TYPES parameters)
    "ARG002",  # Unused method argument
    "PLR2004", # Magic value used in comparison (percentage calculations, thresholds)
]
"**/tasks/**/*.py" = [
    "PLR2004", # Magic value used in comparison (retention period thresholds)
]
"**/util/**/*.py" = [
    "PLR2004", # Magic value used in comparison (HTTP status codes)
]
"**/tests/**/*.py" = [
    "S101",   # Use of assert detected (pytest uses assertions)
    "S105",   # Possible hardcoded password string
    "S106",   # Possible hardcoded password assigned to argument
    "PLR2004", # Magic value used in comparison (test status codes, etc.)
    "ARG001", # Unused function argument (pytest fixtures in function signatures aren't directly called)
    "ARG002", # Unused method argument (common in test mocks)
    "RUF012", # Mutable class attributes should be annotated with ClassVar (not needed in test mocks)
]
# Note: PLC0415 (import-outside-toplevel) removed - use inline noqa comments only where necessary
"**/tests/fixtures/**/*.py" = [
    "PLC0415", # Import should be at the top-level of a file (intentional pattern for fixtures)
]
"**/util/__init__.py" = [
    "PLC0415", # Import should be at the top-level of a file (needed for optional dependencies)
]

# Tool-specific configurations
[tool.ruff.lint.isort]
known-first-party = ["ibutsu_server"]
combine-as-imports = true

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false
mark-parentheses = false

[tool.ruff.lint.pylint]
max-args = 8  # Allow more arguments for API endpoints

[tool.ruff.format]
quote-style = "double"


[tool.coverage.run]
source = ["ibutsu_server"]
branch = true
concurrency = ["thread", "multiprocessing"]
parallel = true
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/migrations/*",
    "*/alembic/*",
]

[tool.coverage.report]
precision = 2
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
# fail_under removed - coverage thresholds managed by codecov.yml

[tool.coverage.xml]
output = "coverage.xml"

[tool.coverage.html]
directory = "htmlcov"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--tb=short -n 16"
markers = [
    "integration: marks tests as integration tests (use real database)",
    "validation: marks tests that validate input/request parameters",
    "unit: marks tests as unit tests (mock external dependencies)",
    "slow: marks tests as slow running (deselect with '-m \"not slow\"')",
]
